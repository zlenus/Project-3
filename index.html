<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crossing state lines for abortion care, 2020</title>
<style>
  body { margin:0; padding:24px 32px; font-family:"Segoe UI", Helvetica, Arial, sans-serif; color:#1d2733; background:#fff; }
  h1 { font-size:1.6rem; margin:0 0 16px; }
  svg { width:100%; max-width:960px; height:auto; display:block; }
  .state { fill:#e9edf1; stroke:#8a96a3; stroke-width:.7; }
</style>
</head>
<body>
<h1>Crossing state lines for abortion care, 2020</h1>
<svg id="map" viewBox="0 0 960 600" role="img" aria-label="Map of US states"></svg>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
const path = d3.geoPath(d3.geoAlbersUsa().scale(1250).translate([480, 300]));

d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3.0.1/states-10m.json").then(us => {
  d3.select("#map").append("g")
    .selectAll("path")
    .data(topojson.feature(us, us.objects.states).features)
    .join("path")
    .attr("class", "state")
    .attr("d", path);
});
</script>
</body>
</html>
